name: Destroy AWS Stack

on:
  workflow_dispatch:  # Manual trigger only - destroys ALL AWS resources!
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: 'no'

jobs:
  destroy:
    name: Destroy Smart Parking Stack
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'DESTROY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Detect LabRole ARN
        id: lab_role
        run: echo "arn=$(bash scripts/find_lab_role.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Destroy
        working-directory: infra/terraform
        env:
          TF_VAR_lab_role_arn: ${{ steps.lab_role.outputs.arn }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: terraform destroy -auto-approve

      - name: Destroy Complete
        run: echo "All AWS resources have been destroyed."
