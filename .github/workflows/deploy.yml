name: CD - Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  deploy:
    name: Deploy Smart Parking Stack to AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Step 1: Verify AWS identity ────────────────────────────────
      - name: Check AWS identity
        run: bash scripts/check_aws_identity.sh

      # ── Step 2: Detect LabRole / VocLabs ───────────────────────────
      - name: Detect LabRole ARN
        id: lab_role
        run: echo "arn=$(bash scripts/find_lab_role.sh)" >> "$GITHUB_OUTPUT"

      # ── Step 3: Package Lambda zips ────────────────────────────────
      - name: Package Lambda functions
        run: bash scripts/package_lambdas.sh

      # ── Step 4: Restore Terraform state (persist between runs) ─────
      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-${{ secrets.AWS_REGION }}

      # ── Step 5: Terraform Init ─────────────────────────────────────
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      # ── Step 6: Import existing resources (adopt previous deploys) ─
      # This is critical: resources created by previous manual deploys
      # exist in AWS but not in Terraform state. We import them so
      # terraform apply doesn't fail with "already exists" errors.
      - name: Import existing AWS resources
        working-directory: infra/terraform
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Importing existing resources (best-effort) ==="
          PROJECT="smart-parking-fyp"
          REGION="${{ secrets.AWS_REGION }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          # DynamoDB tables
          terraform import aws_dynamodb_table.slot_state "${PROJECT}-ParkingSlotState" || true
          terraform import aws_dynamodb_table.parking_events "${PROJECT}-ParkingEvents" || true

          # CloudWatch log groups
          terraform import aws_cloudwatch_log_group.ingest_sensor_data "/aws/lambda/${PROJECT}-ingest-sensor-data" || true
          terraform import aws_cloudwatch_log_group.dashboard_api "/aws/lambda/${PROJECT}-dashboard-api" || true

          # S3 buckets
          terraform import aws_s3_bucket.dashboard "${PROJECT}-dashboard-${ACCOUNT}-${REGION}" || true
          terraform import aws_s3_bucket.reports "${PROJECT}-reports-${ACCOUNT}-${REGION}" || true

          # API Gateway (find by name)
          API_ID="$(aws apigatewayv2 get-apis --query "Items[?Name=='${PROJECT}-http-api'].ApiId" --output text 2>/dev/null || echo "")"
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import aws_apigatewayv2_api.dashboard_api "$API_ID" || true
            terraform import aws_apigatewayv2_stage.default "${API_ID}/dev" || true
            INTEGRATION_ID="$(aws apigatewayv2 get-integrations --api-id "$API_ID" --query "Items[0].IntegrationId" --output text 2>/dev/null || echo "")"
            if [ -n "$INTEGRATION_ID" ] && [ "$INTEGRATION_ID" != "None" ]; then
              terraform import aws_apigatewayv2_integration.dashboard_api "${API_ID}/${INTEGRATION_ID}" || true
            fi
            ROUTE_ROOT="$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='ANY /'].RouteId" --output text 2>/dev/null || echo "")"
            if [ -n "$ROUTE_ROOT" ] && [ "$ROUTE_ROOT" != "None" ]; then
              terraform import aws_apigatewayv2_route.root "${API_ID}/${ROUTE_ROOT}" || true
            fi
            ROUTE_PROXY="$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId" --output text 2>/dev/null || echo "")"
            if [ -n "$ROUTE_PROXY" ] && [ "$ROUTE_PROXY" != "None" ]; then
              terraform import aws_apigatewayv2_route.proxy "${API_ID}/${ROUTE_PROXY}" || true
            fi
          fi

          # Lambda functions
          terraform import aws_lambda_function.ingest_sensor_data "${PROJECT}-ingest-sensor-data" || true
          terraform import aws_lambda_function.dashboard_api "${PROJECT}-dashboard-api" || true

          # IoT topic rule (name uses underscores)
          RULE_NAME="$(echo "${PROJECT}_telemetry_rule" | tr '-' '_')"
          terraform import aws_iot_topic_rule.sensor_telemetry "$RULE_NAME" || true

          echo "=== Import complete ==="

      # ── Step 7: Terraform Apply ────────────────────────────────────
      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          TF_VAR_lab_role_arn: ${{ steps.lab_role.outputs.arn }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: terraform apply -auto-approve

      # ── Step 8: Save Terraform state for next run ─────────────────
      - name: Save Terraform state
        uses: actions/cache/save@v4
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-${{ secrets.AWS_REGION }}

      # ── Step 9: Read outputs ───────────────────────────────────────
      - name: Read Terraform outputs
        working-directory: infra/terraform
        id: tf_outputs
        run: |
          echo "DASHBOARD_BUCKET=$(terraform output -raw dashboard_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "DASHBOARD_URL=$(terraform output -raw dashboard_url)" >> "$GITHUB_OUTPUT"

      # ── Step 10: Generate frontend config.js ───────────────────────
      - name: Generate frontend config.js
        run: |
          mkdir -p frontend
          echo "window.SMART_PARKING_CONFIG = {" > frontend/config.js
          echo "  API_BASE_URL: \"${{ steps.tf_outputs.outputs.API_URL }}\"" >> frontend/config.js
          echo "};" >> frontend/config.js

      # ── Step 11: Upload dashboard to S3 ────────────────────────────
      - name: Upload frontend to S3 dashboard bucket
        run: |
          aws s3 cp frontend/index.html "s3://${{ steps.tf_outputs.outputs.DASHBOARD_BUCKET }}/index.html"
          aws s3 cp frontend/style.css  "s3://${{ steps.tf_outputs.outputs.DASHBOARD_BUCKET }}/style.css"
          aws s3 cp frontend/app.js     "s3://${{ steps.tf_outputs.outputs.DASHBOARD_BUCKET }}/app.js"
          aws s3 cp frontend/config.js  "s3://${{ steps.tf_outputs.outputs.DASHBOARD_BUCKET }}/config.js"

      # ── Step 12: Summary ───────────────────────────────────────────
      - name: Deployment Summary
        run: |
          echo "=============================================="
          echo " DEPLOYMENT COMPLETE!"
          echo "=============================================="
          echo " Dashboard URL : ${{ steps.tf_outputs.outputs.DASHBOARD_URL }}"
          echo " API Gateway   : ${{ steps.tf_outputs.outputs.API_URL }}"
          echo "=============================================="